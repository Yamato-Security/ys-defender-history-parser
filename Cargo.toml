[package]
name = "sootmark-defender"
version = "0.3.0"
# Yamato Security's fork of the upstream crate (https://github.com/Sootmark/defender): not published
# under the upstream name.
publish = false
edition = "2021"
rust-version = "1.80"
description = "Microsoft Defender for forensics: its detection history files (the threat, its status and what was done, where it was found with hashes and times, the user, process, detection source and quarantine entry) and its protection and detection logs (MPLog, MPDetection: detections, programs scanned, exclusions, telemetry, service starts and versions)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Yamato-Security/ys-defender-history-parser"
homepage = "https://github.com/Yamato-Security/ys-defender-history-parser"
keywords = ["forensics", "dfir", "incident-response", "windows", "defender"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "defender"

[dev-dependencies]
# gzip, for the test files stored compressed.
common = { package = "sootmark-common", version = "0.3.7" }
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
